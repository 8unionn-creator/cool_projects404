<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewind Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23d9820f%22/%3E%3Cpath d=%22M8 4 3 8l5 4zm5 0L8 8l5 4z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true">⏪</span> rewind <b>map</b></div>
  <div class="repo" id="repo">…</div>
  <label class="snap">
    <span class="sr">Snapshot</span>
    <select id="snapshot" aria-label="Snapshot to map"></select>
  </label>
  <div class="search">
    <input id="search" type="search" placeholder="Find file or symbol  /" autocomplete="off" aria-label="Find a file or symbol">
    <ul id="results" class="results" hidden></ul>
  </div>
  <div class="tools">
    <div class="depth" title="How many folder levels to group by">
      <button id="depth-minus" aria-label="Group by fewer folder levels">−</button>
      <span id="depth-label">depth 2</span>
      <button id="depth-plus" aria-label="Group by more folder levels">+</button>
    </div>
    <button class="toggle" id="t-heat" aria-pressed="false" title="Color by hotspot score (commits × complexity)">Hotspots</button>
    <button class="toggle" id="t-tests" aria-pressed="false" title="Show test files">Tests</button>
    <button class="toggle" id="t-types" aria-pressed="true" title="Show type-only imports">Type imports</button>
    <button id="fit" title="Fit the map to the screen (F)">Fit</button>
  </div>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <svg id="map" role="img" aria-label="Dependency map">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" class="arrowhead"></path>
        </marker>
        <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" class="arrowhead hot"></path>
        </marker>
        <marker id="arrow-cycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" class="arrowhead cycle"></path>
        </marker>
      </defs>
      <g id="viewport"></g>
    </svg>
    <div class="legend" id="legend"></div>
    <div class="loading" id="loading">Mapping the code…</div>
    <section class="drawer" id="drawer" hidden aria-label="Code changes">
      <div class="drawer-head">
        <div class="drawer-title" id="drawer-title"></div>
        <div class="seg" role="group" aria-label="Diff layout">
          <button data-diffmode="unified" aria-pressed="true">Unified</button>
          <button data-diffmode="split" aria-pressed="false">Side by side</button>
        </div>
        <button id="drawer-close" aria-label="Close the changes view">Close</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </section>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<footer class="timeline" id="timeline" hidden>
  <div class="tl-head">
    <button id="tl-play" aria-label="Play the session">▶</button>
    <div class="tl-title" id="tl-title"></div>
    <div class="tl-keys"><kbd>←</kbd> <kbd>→</kbd> step</div>
  </div>
  <div class="tl-track" id="tl-track" role="listbox" aria-label="Session steps"></div>
</footer>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
