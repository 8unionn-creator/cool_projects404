<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groove Rack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#211715">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Layout: one column like a phone DAW — a stats line, a bar-progress strip, the channel rack (steps for one bar),
   an optional piano roll, then the playlist of waveforms across the whole loop. Single dark, warm look by design. */
:root {
  color-scheme: dark;
  --bg: #221816;
  --bg-deep: #170f0e;
  --panel: #33272459;
  --panel-edge: #ffe6d238;
  --lane: #3a2e2b;
  --btn-top: #4a3b37;
  --btn-bot: #382c29;
  --chip: #1d1513;
  --text: #f2e5d3;
  --muted: #988a83;
  --dim: #6b5e58;
  --line: #ffffff1c;
  --gold: #e8b84a;
  --gold-hi: #f6d27a;
  --green: #86e07c;
  --red: #e36b55;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --namew: clamp(80px, 21%, 150px);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2e211e 0%, var(--bg) 45%, var(--bg-deep) 100%) fixed, var(--bg);
  color: var(--text); font-family: var(--font); font-size: 15px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app {
  max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* stats line */
.stats { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 2.2vw, 16px); flex-wrap: wrap;
  font-size: clamp(17px, 4.7vw, 34px); font-weight: 600; letter-spacing: -0.02em; }
.stats button { background: none; border: 0; padding: 2px 4px; border-radius: 8px; white-space: nowrap; }
.stats button:hover { background: #ffffff0d; }
.stats .sep { width: 3px; height: 1.05em; border-radius: 2px; background: var(--gold); }
.progress { display: flex; gap: 8px; padding: 2px 0 4px; }
.progress button { flex: 1; height: 6px; border: 0; padding: 0; border-radius: 4px; background: #4a3c38; position: relative; overflow: hidden; }
.progress button i { position: absolute; inset: 0 auto 0 0; width: calc(var(--f, 0) * 100%); background: var(--gold); border-radius: 4px; }
.progress button.view { box-shadow: 0 0 0 1px #e8b84a66; }

/* panels */
.panel {
  border-radius: clamp(22px, 5vw, 34px); border: 1.5px solid var(--panel-edge);
  background: linear-gradient(180deg, #3b2d2a 0%, #2c211f 100%);
  box-shadow: inset 0 1px 0 #ffffff14, 0 14px 40px #00000059;
  overflow: hidden;
}
.phead { display: flex; align-items: center; gap: clamp(4px, 1.4vw, 10px); padding: 10px clamp(10px, 2.6vw, 16px);
  border-bottom: 1px solid #ffffff12; background: linear-gradient(180deg, #ffffff08, transparent); min-height: 50px; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; padding: 0; flex: none; color: var(--text); }
.ib:hover { background: #ffffff10; }
.ib svg { width: 19px; height: 19px; }
.ib.boxed { border: 1.5px solid #ffffff40; width: 28px; height: 28px; }
.ib.on { border: 1.5px solid var(--gold); color: var(--gold); width: 28px; height: 28px; }
.chip { background: var(--chip); border: 0; border-radius: 9px; padding: 5px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; box-shadow: inset 0 1px 0 #ffffff0d; }
.chip:hover { background: #2a1f1d; }
.ptitle { font-size: clamp(15px, 3.6vw, 21px); font-weight: 700; margin: 0 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.knob { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; flex: none; position: relative; touch-action: none;
  background: radial-gradient(circle at 40% 35%, #5b4c47, #1c1412 70%); box-shadow: 0 0 0 1.5px #ffffff30, 0 2px 4px #0008; }
.knob::after { content: ""; position: absolute; left: 50%; top: 3px; width: 2px; height: 8px; margin-left: -1px; border-radius: 1px; background: var(--text);
  transform-origin: 50% 10px; transform: rotate(var(--a, 0deg)); }
.sp { flex: 1; }

/* rack grid */
.rack-body { padding: 12px clamp(10px, 2.6vw, 16px) 6px; }
.grid { display: grid; grid-template-columns: var(--namew) 13px minmax(0, 1fr); column-gap: clamp(5px, 1.4vw, 10px); row-gap: 10px; position: relative; }
.row { display: contents; }
.ncell { position: relative; min-width: 0; }
.tname {
  width: 100%; height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 22px 0 10px;
  border-radius: 13px; border: 1px solid #ffffff1a; color: var(--muted);
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bot));
  box-shadow: inset 0 1px 0 #ffffff12, 0 2px 4px #0005; font-weight: 700; font-size: clamp(14px, 3.6vw, 19px); text-align: left;
  touch-action: manipulation;
}
.tname .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tname .dot { width: 9px; height: 9px; border-radius: 50%; background: transparent; flex: none; margin-left: -2px; }
.row.sel .tname { color: var(--text); }
.row.sel .tname .dot { background: var(--gold); box-shadow: 0 0 6px #e8b84a99; }
.led { position: absolute; right: 7px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border: 0; padding: 0; background: none; display: grid; place-items: center; }
.led::before { content: ""; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.3px #ffffff38; background: #00000040; }
.row.sel .led::before, .led.on::before { background: var(--green); box-shadow: 0 0 6px #86e07ccc; }
.row.muted .led::before { background: transparent; box-shadow: inset 0 0 0 1.6px var(--red); }
.row.muted .tname { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row.solo .tname { box-shadow: inset 0 0 0 1.5px var(--gold), 0 2px 4px #0005; }
.meter { display: flex; gap: 3px; height: 46px; }
.meter i { flex: 1; border-radius: 2px; background: #45373350; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px #ffffff10; }
.meter i::after { content: ""; position: absolute; inset: auto 0 0; height: calc(var(--l, 0) * 100%); background: linear-gradient(0deg, #e8b84a, #f8e2a8); }
.meter i:last-child::after { height: calc(var(--l2, 0) * 100%); }
.row.sel .meter i::after { background: linear-gradient(0deg, #e8b84a, #fff1cc); }
.lane { position: relative; height: 46px; border-radius: 13px; background: var(--lane); box-shadow: inset 0 1px 2px #0003; touch-action: none; cursor: pointer; overflow: hidden; }
.lane .dots { position: absolute; inset: 0; background-image: radial-gradient(circle, #ffffff1a 1.4px, transparent 1.8px);
  background-size: calc(100% / var(--res)) 100%; background-repeat: repeat-x; pointer-events: none; }
.pill { position: absolute; top: 50%; height: 58%; transform: translateY(-50%); border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #cf9e33); opacity: calc(0.5 + var(--v, 1) * 0.5);
  box-shadow: inset 0 1px 0 #fff6, 0 1px 3px #0006; color: #3a2a12; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
.pill.ghost { background: transparent; box-shadow: inset 0 0 0 2px #9a8c86; opacity: 1; color: var(--muted); }
.pill.mel { border-radius: 8px; justify-content: flex-start; padding-left: 4px; height: 52%; }
.pill.cont { border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
.pill.slide::before { content: "↗"; margin-right: 1px; }
.pill[data-roll]::after { content: attr(data-roll); }
.overlay { grid-column: 3; grid-row: 1 / var(--end); position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.overlay .bl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.phd { position: absolute; top: -10px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--gold); box-shadow: 0 0 8px #e8b84a88; }
.phd::before { content: ""; position: absolute; top: -4px; left: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
.nums { grid-column: 3; position: relative; height: 40px; }
.nums span { position: absolute; top: 2px; font-weight: 700; font-size: clamp(20px, 5vw, 30px); transform: translateX(-50%); }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 18px 4px; text-align: center; }
.empty button { margin-top: 10px; }

/* mixer rows */
.mix { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px; border-radius: 13px; background: var(--lane); min-width: 0; }
.mix .ms { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #ffffff26; background: #ffffff08; font-weight: 800; font-size: 12px; padding: 0; flex: none; color: var(--muted); }
.mix .ms.on { background: var(--gold); color: #2a1d0c; border-color: var(--gold); }
.mix .ms.mute.on { background: var(--red); border-color: var(--red); color: #fff; }
.mix label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 600; min-width: 0; flex: 2 1 0; }
.mix label.pan { flex: 1.3 1 0; }
.t-short { display: none; }
.mix input { width: 100%; min-width: 0; accent-color: var(--gold); }

/* piano roll */
.rtools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px clamp(10px, 2.6vw, 16px); border-bottom: 1px solid #ffffff10; }
.rtools .sp { flex: 1; }
.seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 2px; gap: 2px; flex: none; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 4px 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: #3e302c; color: var(--text); box-shadow: inset 0 1px 0 #ffffff14; }
.rwrap { max-height: 320px; overflow-y: auto; overscroll-behavior: contain; padding: 0 clamp(10px, 2.6vw, 16px) 0 0; }
.rbody { display: flex; position: relative; }
.rkeys { width: 46px; flex: none; }
.rkeys button { display: block; width: 100%; height: 20px; border: 0; padding: 0 6px 0 0; text-align: right; font-size: 10px; font-weight: 700; color: var(--muted);
  background: #3f322e; border-bottom: 1px solid #00000030; }
.rkeys button.blk { background: #261c1a; color: var(--dim); }
.rkeys button.root { color: var(--gold); }
.rcanvas { flex: 1; position: relative; touch-action: none; cursor: crosshair; min-width: 0;
  background-image: linear-gradient(90deg, #ffffff22 1px, transparent 1px), linear-gradient(90deg, #ffffff0c 1px, transparent 1px);
  background-size: 25% 100%, calc(100% / var(--res)) 100%; }
.rrow { height: 20px; border-bottom: 1px solid #00000028; }
.rrow.ins { background: #ffffff07; }
.rrow.root { background: #e8b84a12; }
.rrow.out { background: #0000001f; }
.rnote { position: absolute; height: 18px; border-radius: 5px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); opacity: calc(0.55 + var(--v, 1) * 0.45);
  box-shadow: inset 0 1px 0 #fff6, 0 1px 2px #0006; color: #3a2a12; font-size: 10px; font-weight: 800; padding-left: 4px; line-height: 18px; overflow: hidden; white-space: nowrap; pointer-events: none; }
.rnote::after { content: ""; position: absolute; right: 2px; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: #0000002e; }
.rnote.cont { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.rhint { font-size: 12px; color: var(--muted); padding: 8px 16px 10px; }

/* playlist */
.pl-body { padding: 14px clamp(10px, 2.6vw, 16px) 6px; }
.pl .grid { row-gap: 6px; }
.pl .tname { height: 40px; }
.pl .meter { height: 40px; }
.pl .lane { height: 40px; background: none; box-shadow: none; border-radius: 0; }
.pl .lane canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl .nums { height: 28px; }
.pl .nums span { font-size: clamp(13px, 3.4vw, 19px); font-weight: 600; transform: none; margin-left: 6px; }
.pl .bl.cur { background: #e8b84a40; }

.hint { color: var(--dim); font-size: 12.5px; line-height: 1.55; text-align: center; padding: 0 8px; max-width: 60ch; margin: 0 auto; text-wrap: balance; }
.hint b { color: var(--muted); font-weight: 600; }

/* sheets */
.scrim { position: fixed; inset: 0; background: #0b0605a8; z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet { width: 100%; max-width: 600px; max-height: min(86vh, 860px); overflow-y: auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, #3a2c29, #2a1f1d); border: 1.5px solid var(--panel-edge); border-bottom: 0;
  border-radius: 26px 26px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  box-shadow: 0 -10px 40px #0008; animation: up .2s ease-out; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 26px; border-bottom: 1.5px solid var(--panel-edge); } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #ffffff30; margin: 4px auto 10px; }
.sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.sh-head h3 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-sec { margin-top: 16px; }
.sh-sec > h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ctl { display: grid; grid-template-columns: 92px minmax(0, 1fr) 54px; align-items: center; gap: 10px; margin: 8px 0; }
.ctl > span:first-child { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.ctl output { font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; font-weight: 700; }
.ctl input[type=range] { width: 100%; accent-color: var(--gold); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.b { border: 1px solid #ffffff1f; background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); border-radius: 11px; padding: 8px 13px; font-weight: 700; font-size: 14px;
  box-shadow: inset 0 1px 0 #ffffff12; }
.b:hover { border-color: #ffffff3a; }
.b.gold { background: var(--gold); color: #2a1d0c; border-color: var(--gold); }
.b.on { box-shadow: inset 0 0 0 1.5px var(--gold); color: var(--gold-hi); }
.b.warn { color: #f0a090; }
.b.sm { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.txt { width: 100%; background: var(--chip); border: 1px solid #ffffff1c; border-radius: 10px; padding: 9px 12px; font-weight: 600; }
select.txt { padding: 8px 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.card { text-align: left; border: 1px solid #ffffff1a; background: linear-gradient(180deg, #45363250, #2a201e); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.card:hover { border-color: #e8b84a80; }
.card b { font-size: 15.5px; }
.card .bpm { font-style: normal; font-size: 12px; color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.card span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.inst { padding: 8px 0; border-top: 1px solid #ffffff10; }
.inst > b { display: block; margin-bottom: 6px; font-size: 14.5px; }
.saved { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #ffffff10; }
.saved span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.saved small { color: var(--dim); font-weight: 500; }
.keys-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; color: var(--muted); }
.keys-list kbd { font-family: var(--font); font-weight: 700; color: var(--text); background: var(--chip); border-radius: 6px; padding: 1px 7px; justify-self: start; }
.big-bpm { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.big-bpm small { font-size: 16px; color: var(--muted); font-weight: 700; margin-left: 4px; }
.big-bpm .b { font-size: 22px; width: 48px; height: 48px; padding: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: #f2e5d3; color: #241815; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px #0009;
  max-width: calc(100vw - 32px); text-align: center; animation: up .18s ease-out; }
.vis { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 430px) { .t-long { display: none; } .t-short { display: inline; } }
@media (max-width: 460px) {
  .phead .hide-sm { display: none; }
  :root { --namew: clamp(100px, 28%, 130px); }
  .phead { gap: 2px; padding-inline: 7px; }
  .ib { width: 23px; height: 23px; }
  .ib.on, .ib.boxed { width: 23px; height: 23px; }
  .ib svg { width: 16px; height: 16px; }
  .chip { padding: 4px 7px; font-size: 12.5px; }
  .knob { width: 22px; height: 22px; }
  .knob::after { top: 2px; height: 7px; transform-origin: 50% 9px; }
  .ptitle { font-size: 14.5px; }
  .tname { padding-left: 6px; padding-right: 18px; height: 42px; border-radius: 11px; font-size: 13.5px; gap: 4px; }
  .led { right: 3px; }
  .rtools .seg button { padding: 4px 7px; }
  .mix { gap: 5px; padding: 0 6px; }
  .mix label span { display: none; }
  .meter, .lane { height: 42px; }
  .ctl { grid-template-columns: 76px minmax(0, 1fr) 48px; }
}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="stats" role="toolbar" aria-label="Song">
    <button id="bpmBtn" title="Tempo, swing, key and loop length"><span id="bpmVal">150</span> BPM</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="soundBtn" title="Next sound for the selected track">bounce kick</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="tracksBtn" title="Add a track"><span id="trackCount">9</span> tracks</button>
  </div>
  <div class="progress" id="progress" aria-label="Bars in the loop"></div>

  <section class="panel rack" id="rack" aria-label="Channel rack">
    <div class="phead">
      <button class="ib" id="playBtn" aria-label="Play"></button>
      <button class="ib" id="undoBtn" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="chip" id="groupBtn" title="Switch rack">Audio ▸</button>
      <button class="ib" id="menuBtn" aria-label="Menu: genres, save, export" title="Genres, save, export"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      <button class="ib hide-sm" id="muteBtn" aria-label="Mute output" title="Mute output"></button>
      <h2 class="ptitle" id="rackTitle">Channel rack</h2>
      <button class="knob" id="knob" aria-label="Master volume" title="Master volume (drag)"></button>
      <button class="chip" id="barBtn" title="Bars">bar 1 of 8</button>
      <button class="ib hide-sm" id="mixBtn" aria-label="Mixer view" title="Mixer view"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="3" height="9" rx="1"/><rect x="8" y="5" width="3" height="16" rx="1"/><rect x="13" y="9" width="3" height="12" rx="1"/><rect x="18" y="14" width="3" height="7" rx="1"/></svg></button>
      <button class="ib on" id="stepBtn" aria-label="Step view" title="Step view"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="10.5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/></svg></button>
      <button class="ib boxed" id="foldBtn" aria-label="Hide rack" title="Hide rack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </div>
    <div class="rack-body" id="rackBody"><div class="grid" id="rackGrid"></div></div>
  </section>

  <section class="panel roll" id="roll" aria-label="Piano roll" hidden></section>

  <section class="panel pl" id="pl" aria-label="Playlist">
    <div class="pl-body"><div class="grid" id="plGrid"></div></div>
  </section>

  <p class="hint"><b>Tap</b> an empty step to add a hit. <b>Drag up or down</b> on a hit for velocity, <b>sideways</b> to paint. <b>Hold</b> a hit for rolls and options. Tap a track name to select it, tap again for its sound and settings. <b>Space</b> plays.</p>
