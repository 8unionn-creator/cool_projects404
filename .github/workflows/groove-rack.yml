name: groove rack plugin

# Builds the Groove Rack plugin (VST3, AU on macOS, and a standalone app) for Windows, macOS and Linux.
# Every push that touches groove-rack/ uploads the builds as workflow artifacts.
# Push a tag such as groove-rack-v0.2.0 to publish them as a GitHub release.
on:
  push:
    paths: ["groove-rack/**", ".github/workflows/groove-rack.yml"]
    tags: ["groove-rack-v*"]
  pull_request:
    paths: ["groove-rack/**", ".github/workflows/groove-rack.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. groove-rack-v0.2.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generator:
    name: Genre rule tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every style of every genre keeps its rules
        run: node groove-rack/tests/genre-rules.js

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: groove-rack/plugin
    steps:
      - uses: actions/checkout@v5

      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: WebView2 SDK
        if: runner.os == 'Windows'
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$RUNNER_TEMP/webview2"

      - name: Configure
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DGR_TESTS=ON)
          if [ "$RUNNER_OS" = "macOS" ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          if [ "$RUNNER_OS" = "Windows" ]; then args+=("-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$RUNNER_TEMP/webview2"); fi
          cmake -B build "${args[@]}"

      - name: Build
        run: |
          targets=(GrooveRack_VST3 GrooveRack_Standalone GrooveRackEngineTest)
          if [ "$RUNNER_OS" = "macOS" ]; then targets+=(GrooveRack_AU); fi
          for t in "${targets[@]}"; do cmake --build build --config Release --parallel 4 --target "$t"; done

      - name: Engine test
        run: |
          exe=build/GrooveRackEngineTest_artefacts/Release/GrooveRackEngineTest
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe"

      - name: Package
        run: |
          out="$PWD/dist/GrooveRack-${{ matrix.name }}"
          mkdir -p "$out"
          art=build/GrooveRack_artefacts/Release
          cp -R "$art/VST3/Groove Rack.vst3" "$out/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$art/AU/Groove Rack.component" "$art/Standalone/Groove Rack.app" "$out/"
            for b in "$out/Groove Rack.vst3" "$out/Groove Rack.component" "$out/Groove Rack.app"; do codesign --force --deep -s - "$b"; done
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "$art/Standalone/Groove Rack.exe" "$out/"
          else
            cp "$art/Standalone/Groove Rack" "$out/"
          fi
          cp INSTALL.md "$out/"
          cd dist && cmake -E tar cf "GrooveRack-${{ matrix.name }}.zip" --format=zip "GrooveRack-${{ matrix.name }}"

      - name: Installer
        if: runner.os != 'Linux'
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          ver=$(sed -n 's/^project(GrooveRack VERSION \(.*\))/\1/p' CMakeLists.txt)
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash installer/macos/make-pkg.sh "$PWD/dist/GrooveRack-macOS" "$ver" "$PWD/dist/GrooveRack-macOS-Installer.pkg"
          else
            iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            [ -f "$iscc" ] || choco install innosetup -y --no-progress
            "$iscc" /DAppVer="$ver" installer/windows/GrooveRack.iss
          fi

      # install the way people do, then check it: macOS runs the Audio Unit validation Logic runs before it lists a plugin
      - name: Install and check
        if: runner.os != 'Linux'
        timeout-minutes: 8
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            sudo installer -pkg dist/GrooveRack-macOS-Installer.pkg -target /
            ls -d "/Library/Audio/Plug-Ins/Components/Groove Rack.component" "/Library/Audio/Plug-Ins/VST3/Groove Rack.vst3" "/Applications/Groove Rack.app"
            codesign -dv "/Library/Audio/Plug-Ins/Components/Groove Rack.component" 2>&1 | head -4
            sleep 2
            auval -a | grep -i "Grvr" || echo "Groove Rack is not registered as an Audio Unit"
            auval -v aumu Grvr Cp44
          else
            ./dist/GrooveRack-Windows-Setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            sleep 5
            ls "/c/Program Files/Common Files/VST3/Groove Rack.vst3/Contents/x86_64-win/Groove Rack.vst3"
            ls "/c/Program Files/Groove Rack/Groove Rack.exe"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GrooveRack-${{ matrix.name }}
          path: |
            groove-rack/plugin/dist/GrooveRack-${{ matrix.name }}.zip
            groove-rack/plugin/dist/GrooveRack-${{ matrix.name }}-*.pkg
            groove-rack/plugin/dist/GrooveRack-${{ matrix.name }}-*.exe

  # Runs for a pushed groove-rack-v* tag, or for "Run workflow" with a release tag filled in
  # (then the tag is created here, on the commit that was built).
  # It still publishes when only the Linux build failed: Windows and macOS are required, Linux is added when it built.
  release:
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/groove-rack-v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'groove-rack-v'))) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          for need in GrooveRack-Windows.zip GrooveRack-macOS.zip GrooveRack-Windows-Setup.exe GrooveRack-macOS-Installer.pkg; do
            [ -f "dist/$need" ] || { echo "$need is missing, so there is no release." >&2; exit 1; }
          done
          version="${TAG#groove-rack-v}"
          LINUX_ROW=""
          [ -f dist/GrooveRack-Linux.zip ] && LINUX_ROW="| Linux | | GrooveRack-Linux.zip: VST3 and the app |"
          cat > notes.md <<EOF
          **Groove Rack $version**, the GR-16 drum and bass groove machine, as a plugin for your DAW.

          | Your computer | Installer (recommended) | Or the files to copy yourself |
          |---|---|---|
          | macOS 10.15 or later (Intel and Apple Silicon) | **GrooveRack-macOS-Installer.pkg**: Audio Unit (Logic, GarageBand), VST3 and the app | GrooveRack-macOS.zip |
          | Windows 10 / 11 | **GrooveRack-Windows-Setup.exe**: VST3 and the app | GrooveRack-Windows.zip |
          $LINUX_ROW

          **Install:** open the installer and click through it, then open your DAW. In Logic: Software Instrument track → AU Instruments → cool_projects404 → Groove Rack. Other DAWs: rescan plugins and load Groove Rack as an instrument.

          These builds are not signed with a paid Apple or Microsoft certificate, so the first time you open the installer:
          - **Mac:** if macOS says it cannot check the installer, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (on macOS 14 and older you can also right-click the installer and choose **Open**).
          - **Windows:** if SmartScreen says it protected your PC, click **More info → Run anyway**.

          **What it does:** 15 genres with 44 styles (UK, NY and Chicago drill, log drum and private school Amapiano, dembow and perreo, UK garage, jungle and more), each with its own tempo, feel, chords and bass. GENERATE and a dice on every channel write new drum and bass patterns in the style; teach a style with your own MIDI loops, or 👍 / 👎 what it makes. A piano roll on every channel (whole loop, chord lane, velocity lane, pitch any drum hit), 4 or 8 bar loops that switch bars seamlessly, your own samples on any channel, tempo locked to your DAW, MIDI out of the pattern, DAW notes play the channels, and a strip to drag the loop into your DAW as MIDI.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Groove Rack $version" --notes-file notes.md --latest
          fi
