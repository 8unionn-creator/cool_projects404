name: rewind

on:
  push:
    paths: ["rewind/**", ".github/workflows/rewind.yml"]
  pull_request:
    paths: ["rewind/**", ".github/workflows/rewind.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rewind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rewind/go.mod
          cache-dependency-path: rewind/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
