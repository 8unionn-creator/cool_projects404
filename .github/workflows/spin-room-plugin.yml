name: spin-room plugin

# Builds the Spin Room plugin for macOS (AU, VST3 and the standalone app, Apple Silicon and Intel) and tests it:
# the capture engine on its own, the built VST3 loaded in a host, auval, and pluginval. Then it makes the installer
# and checks that installing it registers the Audio Unit.
# Push a tag such as spin-room-v0.1.0 (or Run workflow with a release tag) to publish a GitHub release.
# Signing is optional and uses the same secrets as Liftoff (see liftoff/plugin/README.md, "Signed releases").
on:
  push:
    paths: ["spin-room-plugin/**", "spin-room/index.html", "spin-room/vendor/**", ".github/workflows/spin-room-plugin.yml"]
    tags: ["spin-room-v*"]
  pull_request:
    paths: ["spin-room-plugin/**", "spin-room/index.html", "spin-room/vendor/**", ".github/workflows/spin-room-plugin.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. spin-room-v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MAC_SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
      MAC_NOTARIZE: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    defaults:
      run:
        shell: bash
        working-directory: spin-room-plugin
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSR_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: |
          for t in SpinRoom_AU SpinRoom_VST3 SpinRoom_Standalone SpinRoomCaptureTest SpinRoomHostTest; do
            cmake --build build --config Release --parallel 4 --target "$t"
          done

      - name: Capture engine test
        run: build/SpinRoomCaptureTest_artefacts/Release/SpinRoomCaptureTest

      - name: The VST3 in a host
        run: build/SpinRoomHostTest_artefacts/Release/SpinRoomHostTest "build/SpinRoom_artefacts/Release/VST3/Spin Room.vst3"

      # a temporary keychain with the Developer ID certificates (Application, and Installer for the .pkg)
      - name: Signing identity
        if: env.MAC_SIGN == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          tmp="${RUNNER_TEMP:?}"
          kc="$tmp/spinroom.keychain-db" kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$CERT_P12" | base64 --decode > "$tmp/app.p12"
          security import "$tmp/app.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          if [ -n "$INSTALLER_P12" ]; then
            echo "$INSTALLER_P12" | base64 --decode > "$tmp/installer.p12"
            security import "$tmp/installer.p12" -k "$kc" -P "${INSTALLER_PASSWORD:-$CERT_PASSWORD}" -T /usr/bin/productbuild
          fi
          rm -f "$tmp/app.p12" "$tmp/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          inst=$(security find-identity -v "$kc" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          [ -n "$app" ] || { echo "No Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }
          echo "SR_APP_IDENTITY=$app" >> "$GITHUB_ENV"
          if [ -n "$inst" ]; then echo "SR_INSTALLER_IDENTITY=$inst" >> "$GITHUB_ENV"; fi
          echo "signing as: $app${inst:+ / $inst}"

      - name: Package
        run: |
          out="$PWD/dist/SpinRoom-macOS"
          mkdir -p "$out"
          art=build/SpinRoom_artefacts/Release
          cp -R "$art/VST3/Spin Room.vst3" "$art/AU/Spin Room.component" "$art/Standalone/Spin Room.app" "$out/"
          for b in "$out/Spin Room.vst3" "$out/Spin Room.component" "$out/Spin Room.app"; do
            if [ -n "${SR_APP_IDENTITY:-}" ]; then
              codesign --force --deep --options runtime --timestamp --entitlements installer/macos/entitlements.plist -s "$SR_APP_IDENTITY" "$b"
            else
              codesign --force --deep -s - "$b"
            fi
          done
          lipo -info "$out/Spin Room.vst3/Contents/MacOS/Spin Room"
          cp INSTALL.md "$out/"
          cd dist && ditto -c -k --sequesterRsrc --keepParent SpinRoom-macOS SpinRoom-macOS.zip

      - name: Installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ver=$(sed -n 's/^project(SpinRoom VERSION \(.*\))/\1/p' CMakeLists.txt)
          pkg="$PWD/dist/SpinRoom-macOS-Installer.pkg"
          bash installer/macos/make-pkg.sh "$PWD/dist/SpinRoom-macOS" "$ver" "$pkg"
          if [ -n "${SR_INSTALLER_IDENTITY:-}" ] && [ "$MAC_NOTARIZE" = "true" ]; then
            xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
            xcrun stapler staple "$pkg"
          fi

      - name: Install, then check with auval and pluginval
        timeout-minutes: 15
        run: |
          sudo installer -pkg dist/SpinRoom-macOS-Installer.pkg -target /
          ls -d "/Library/Audio/Plug-Ins/Components/Spin Room.component" "/Library/Audio/Plug-Ins/VST3/Spin Room.vst3" "/Applications/Spin Room.app"
          sleep 2
          auval -a | grep -i "Spnr" || echo "Spin Room is not registered as an Audio Unit yet"
          auval -v aufx Spnr Cp44
          curl -sSL -o "$RUNNER_TEMP/pluginval.zip" https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q -o "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP"
          pv="$RUNNER_TEMP/pluginval.app/Contents/MacOS/pluginval"
          "$pv" --strictness-level 5 --skip-gui-tests --timeout-ms 180000 --validate "/Library/Audio/Plug-Ins/VST3/Spin Room.vst3"
          "$pv" --strictness-level 5 --skip-gui-tests --timeout-ms 180000 --validate "/Library/Audio/Plug-Ins/Components/Spin Room.component"

      - uses: actions/upload-artifact@v4
        with:
          name: SpinRoom-macOS
          path: |
            spin-room-plugin/dist/SpinRoom-macOS.zip
            spin-room-plugin/dist/SpinRoom-macOS-Installer.pkg
          if-no-files-found: error

  release:
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/spin-room-v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'spin-room-v'))) }}
    needs: [macos]
    runs-on: ubuntu-latest
    env:
      MAC_SIGNED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          for need in SpinRoom-macOS.zip SpinRoom-macOS-Installer.pkg; do
            [ -f "dist/$need" ] || { echo "$need is missing, so there is no release." >&2; exit 1; }
          done
          version="${TAG#spin-room-v}"
          UNSIGNED=""
          [ "$MAC_SIGNED" = "true" ] || UNSIGNED="This build is not signed with a paid Apple certificate, so the first time you open the installer macOS may say it can't check it. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**."
          cat > notes.md <<EOF
          **Spin Room $version**: put it on your Master channel, play your beat, and it becomes a video for TikTok, Reels or YouTube.

          | Download | What |
          |---|---|
          | **SpinRoom-macOS-Installer.pkg** | The installer (recommended): Audio Unit, VST3 and the Spin Room app |
          | SpinRoom-macOS.zip | The same files to copy yourself, with INSTALL.md |

          $UNSIGNED
          EOF
          gh release create "$TAG" dist/SpinRoom-macOS-Installer.pkg dist/SpinRoom-macOS.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Spin Room $version" --notes-file notes.md
